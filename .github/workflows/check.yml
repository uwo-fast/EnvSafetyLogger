name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.40.0"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Setup (Nano Every core and libraries, pinned in the justfile)
        run: just setup

      - name: Check (compile the firmware)
        run: just check
